services:
  app:
    container_name: adoptme_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5100}:5100"
    volumes:
      - ./static/uploads:/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306 # puerto interno del contenedor MySQL

  db:
    container_name: adoptme_db
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306" # 3307 en el host para no chocar con un MySQL local
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_NAME:-adoptme}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
