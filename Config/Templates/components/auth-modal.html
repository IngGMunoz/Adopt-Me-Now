{# Modal que invita a iniciar sesión antes de adoptar (comportamiento en JS/app.js) #}
{% if not current_user %}
<div id="authModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="authModalTitle" hidden>
    <div class="modal__dialog">
        <button type="button" class="modal__close" data-close-modal aria-label="Cerrar">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="modal__icon" aria-hidden="true"><i class="fa-solid fa-paw"></i></div>
        <h2 id="authModalTitle" class="modal__title">¡Hola, futuro adoptante!</h2>
        <p class="modal__text">
            Para adoptar a <strong id="modalPetName">esta mascota</strong> necesitas una cuenta.
            Es gratis y toma menos de un minuto.
        </p>
        <div class="modal__actions">
            <a id="authModalLoginLink" href="{{ url_for('Iniciar_Sesion') }}" class="btn btn--primary btn--block">
                <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Iniciar sesión
            </a>
            <a id="authModalRegisterLink" href="{{ url_for('Registro_Usuario') }}" class="btn btn--secondary btn--block">
                <i class="fa-solid fa-user-plus" aria-hidden="true"></i> Crear cuenta
            </a>
            <button type="button" class="btn btn--ghost btn--block" data-close-modal>Ahora no</button>
        </div>
    </div>
</div>
{% endif %}
